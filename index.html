<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cannoli Capers</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <header class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-title">Cannoli Capers</span>
      <span class="brand-mark">◆</span>
    </header>
    <div id="frame">
      <div id="bezel">
        <canvas id="game" width="960" height="540" aria-label="Cannoli Capers game canvas"></canvas>
      </div>
    </div>
    <footer class="hint" id="hint">
      <kbd>WASD</kbd> / <kbd>Arrows</kbd> move ·
      <kbd>W</kbd>/<kbd>↑</kbd> jump ·
      <kbd>Space</kbd> or Click shoot ·
      <kbd>P</kbd> pause ·
      <kbd>R</kbd> restart
    </footer>
  </div>
  <script src="game.js"></script>
</body>
</html>
